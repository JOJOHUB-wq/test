# ----------------------------------------------------------------
#
#                      AtheriumEnchants
#         Главный конфигурационный файл зачарований
#
# ----------------------------------------------------------------
# Здесь вы можете настроить каждый аспект каждого кастомного зачарования.
#
# ОБЩИЕ ПАРАМЕТРЫ:
#
# enabled: (true/false) - Включено ли зачарование? Если false, оно не будет работать и не будет доступно.
# display_name: "Название" - Имя, которое будет отображаться в описании предмета (lore).
# max_level: <число> - Максимальный уровень зачарования.
# rarity: "RARITY" - Редкость. Влияет на шанс получения на столе зачарований.
#   Возможные значения: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
# price: <число> - Цена для покупки в меню (требует Vault и экономический плагин).
# enchanting_chance: <число от 0.0 до 1.0> - Базовый шанс получения на столе зачарований (напр., 0.05 = 5%).
#   Финальный шанс также зависит от уровня стола зачарования.
# enchanting_table_enabled: (true/false) - Можно ли получить это зачарование на столе зачарований?
# conflicts_with: [...] - Список зачарований, с которыми это несовместимо.
#   Используйте официальные названия Bukkit (напр., "SHARPNESS", "SILK_TOUCH").
# applicable_items: [...] - Список предметов, на которые можно наложить это зачарование.
#   Используйте официальные названия материалов Bukkit.
# levels: - Настройки для каждого уровня. Здесь находятся уникальные параметры для каждого зачарования.
#
# ----------------------------------------------------------------

