name: CustomEnchants
version: 1.0
main: com.customenchants.CustomEnchants
api-version: 1.21
author: Jules
description: A custom enchantments plugin.
commands:
  enchants:
    description: Opens the custom enchants menu.
    usage: /<command>
  giveenchant:
    description: Gives a player a custom enchanted book.
    usage: /<command> <player> <enchant> [level]
    permission: customenchants.give