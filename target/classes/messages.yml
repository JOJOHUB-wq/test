ru:
  welcome_message: "Привет! Я бот для мониторинга Minecraft серверов."
  server_added: "✅ Сервер {0} успешно добавлен."
  server_removed: "✅ Сервер {0} удален."
  server_not_found: "❌ Сервер не найден."
  ping_online: "🟢 Сервер {0} онлайн\n📊 Онлайн: {1}/{2}\n🎮 Версия: {3}\n⏱ Пинг: {4}ms"
  ping_offline: "🔴 Сервер {0} недоступен\n❌ Причина: {1}"
  error_invalid_format: "❌ Неверный формат. Пример: {0}"
  server_already_exists: "❌ Сервер уже добавлен."
  alias_set: "✅ Алиас {0} установлен для {1}."
  stats_header: "📊 Статистика {0}"
  top_header: "🏆 Топ серверов РуМК (страница {0}):"
  top_entry: "{0}. {1} - {2} игроков"
  notify_on: "🔔 Уведомления включены."
  notify_off: "🔕 Уведомления выключены."
  autostat_on: "✅ Автостатистика включена."
  autostat_off: "❌ Автостатистика выключена."
  quote_generated: "✅ Цитата создана."
  players_list: "👥 Игроки на {0}: {1}"
  graph_color_changed: "✅ Цвет графика изменен."
  graph_bg_changed: "✅ Фон графика изменен."
  signature_changed: "✅ Подпись изменена."
  lang_changed: "✅ Язык изменен на Русский."
  help_text: |
    📋 Список команд:
    ✏️ добавить <ip> - добавить сервер
    ✏️ удалить <ip> - удалить сервер
    ✏️ пинг <ip> - проверить статус
    ✏️ алиас <ip> <имя> - установить имя
    ✏️ стата [ip] - график онлайна
    ✏️ топ - топ серверов
    ✏️ автодоб - список для добавления
    ✏️ уведомления - вкл/выкл уведомления
    ✏️ автостата - статистика в ЛС
    ✏️ цитата - создать цитату (нужно переслать сообщение)
    👑 неделя [ip] - статистика за неделю
    👑 сумма - суммарная статистика
    👑 игроки <ip> - список игроков
    👑 сравнить <ip1> <ip2> - сравнение
    👑 график <цвет> - цвет графика
    👑 график фон <url> - фон графика
    👑 подпись <текст> - подпись для цитат
    🌐 lang <код> - сменить язык

en:
