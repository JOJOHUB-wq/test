# =================================================================================================
#
#                                     AtheriumEnchants
#                      Главный конфигурационный файл всех зачарований
#
# =================================================================================================
#
# --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ ---
#
# disable_enchants_on_sneak: (true/false)
#   Если true, то кастомные зачарования на инструментах (Бульдозер, Дровосек и т.д.)
#   не будут срабатывать, если игрок копает с зажатой клавишей Shift.
#   Это позволяет игрокам добывать одиночные блоки, даже если на инструменте есть мощное зачарование.
#
disable_enchants_on_sneak: true
#
# Здесь вы можете настроить КАЖДЫЙ аспект КАЖДОГО кастомного зачарования.
#
# --- ОБЩИЕ ПАРАМЕТРЫ ДЛЯ ВСЕХ ЗАЧАРОВАНИЙ ---
#
# enabled: (true/false) - Включено ли зачарование? Если false, оно полностью перестает работать.
# name: "Отображаемое имя" - Как зачарование будет называться в игре (в лоре предмета).
# description: [...] - Описание, которое будет добавлено в лор зачарованной книги.
# max_level: <число> - Максимальный уровень зачарования.
# anvil_cost: <число> - Базовая стоимость в уровнях опыта для наложения в наковальне. Финальная стоимость = anvil_cost * уровень_зачарования.
# target_items: [...] - Список предметов, на которые можно наложить это зачарование. Можно использовать как конкретные материалы (DIAMOND_SWORD), так и категории (SWORDS, AXES, PICKAXES, ARMOR, BOOTS).
# conflicts: [...] - Список зачарований, с которыми это несовместимо. Указывайте внутренние имена (напр., "vampirism", "sharpness").
# rarity: "RARITY" - Редкость. Влияет на шанс получения на столе зачарований.
#   Возможные значения: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
# rarity_display: "Название редкости" - (Опционально) Кастомное, цветное название редкости для меню. Если не указано, используется значение из 'rarity'.
#
# --- ПАРАМЕТРЫ ДЛЯ СТОЛА ЗАЧАРОВАНИЙ ---
#
# table:
#   enabled: (true/false) - Можно ли получить на столе зачарований?
#   chance_weight: <число> - "Вес" шанса. Чем выше число, тем чаще будет выпадать по сравнению с другими.
#   min_level: <число> - Минимальный уровень стола для появления.
#
# --- ПАРАМЕТРЫ ДЛЯ ПОКУПКИ В МЕНЮ ---
#
# purchase:
#   enabled: (true/false) - Можно ли купить в меню?
#   price: <число> - Цена за книгу 1-го уровня.
#
# --- НАСТРОЙКИ УРОВНЕЙ (levels) ---
#
# Здесь находятся уникальные параметры для каждого уровня зачарования (шанс, сила, радиус и т.д.)
#
# =================================================================================================

